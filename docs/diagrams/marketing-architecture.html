  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      min-height: 100vh;
      padding: 2rem;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 2rem;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .pulse-dot {
      width: 12px;
      height: 12px;
      background: #22d3ee;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;

      border-radius: 1rem;
      border: 1px solid #1e293b;
      padding: 1.5rem;
      overflow-x: auto;
    }

    svg {
      width: 100%;
      min-width: 900px;
      display: block;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }

    .card {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 0.75rem;
      border: 1px solid #1e293b;
      padding: 1.25rem;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .card-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .card-dot.cyan { background: #22d3ee; }
    .card-dot.emerald { background: #34d399; }
    .card-dot.violet { background: #a78bfa; }
    .card-dot.amber { background: #fbbf24; }
    .card-dot.rose { background: #fb7185; }

      font-weight: 600;

    .card ul {
      list-style: none;
      color: #94a3b8;
      font-size: 0.75rem;

    .card li {

    }

    .toolbar {

    .toolbar-toggle {

      border: none;

      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      transition: color 0.2s, background 0.2s;

    .toolbar-toggle:hover { color: #94a3b8; background: rgba(30, 41, 59, 0.5); }
    .toolbar-actions {

      gap: 0.5rem;

    .toolbar.expanded .toolbar-actions { display: flex; }
    .toolbar-actions button {

      border: 1px solid #334155;

    @media print {
      body { background: #020617; padding: 1rem; }

="2" fill="#34d399"/><text x="484" y="195" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">HTTP API</text><text x="484" y="222" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Чтение сохранённых данных</text><rect x="840" y="160" width="300" height="104" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".65" stroke-width="1.5"/><rect x="856" y="180" width="4" height="64" rx="2" fill="#a78bfa"/><text x="874" y="195" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">PostgreSQL</text><text x="874" y="222" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Бизнес-история</text><text x="874" y="243" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Снимки переписок</text><rect x="60" y="370" width="300" height="104" rx="14" fill="#0f172a" stroke="#fb7185" stroke-opacity=".65" stroke-width="1.5"/><rect x="76" y="390" width="4" height="64" rx="2" fill="#fb7185"/><text x="94" y="405" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Webhook receiver</text><text x="94" y="432" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Отдельный публичный вход</text><text x="94" y="453" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Проверка входящих событий</text><rect x="450" y="370" width="300" height="104" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-opacity=".65" stroke-width="1.5"/><rect x="466" y="390" width="4" height="64" rx="2" fill="#fbbf24"/><text x="484" y="405" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Collector worker</text><text x="484" y="432" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Небольшие порции</text><text x="484" y="453" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Пауза после rate limit</text><rect x="840" y="370" width="300" height="104" rx="14" fill="#0f172a" stroke="#94a3b8" stroke-opacity=".65" stroke-width="1.5"/><rect x="856" y="390" width="4" height="64" rx="2" fill="#94a3b8"/><text x="874" y="405" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Внешние API</text><text x="874" y="432" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Метрики и сообщения</text><text x="874" y="453" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Задержки и ограничения</text><rect x="60" y="580" width="300" height="104" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65" stroke-width="1.5"/><rect x="76" y="600" width="4" height="64" rx="2" fill="#22d3ee"/><text x="94" y="615" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Приватный UI/API</text><text x="94" y="642" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Локальное рабочее место</text><text x="94" y="663" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Не опубликован туннелем</text><rect x="450" y="580" width="300" height="104" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65" stroke-width="1.5"/><rect x="466" y="600" width="4" height="64" rx="2" fill="#34d399"/><text x="484" y="615" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Адаптеры</text><text x="484" y="642" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Период / источник / время</text><text x="484" y="663" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Нормализация и ошибки</text><rect x="840" y="580" width="300" height="104" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".65" stroke-width="1.5"/><rect x="856" y="600" width="4" height="64" rx="2" fill="#a78bfa"/><text x="874" y="615" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Архив кампании</text><text x="874" y="642" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Дневные данные</text><text x="874" y="663" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Контекст реш   <script>
    async function copyAsImage(btn) {
      const orig = btn.textContent;
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        btn.textContent = '✓ Copied!';
      } catch (e) {
        btn.textContent = '✗ Failed';
      }
      setTimeout(() => btn.textContent = orig, 2000);
    }

    async function downloadPNG(btn) {
      const orig = btn.textContent;
      btn.textContent = '⏳ ...';
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const link = document.createElement('a');
        link.download = 'diagram.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        btn.textContent = '✓ Done!';
      } catch (e) {
        btn.textContent = '✗ Failed';
      }
      setTimeout(() => btn.textContent = orig, 2000);
    }

    async function downloadPDF(btn) {
      const orig = btn.textContent;
      btn.textContent = '⏳ ...';
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const orientation = canvas.width > canvas.height ? 'landscape' : 'portrait';
        const pdf = new jsPDF({ orientation, unit: 'px', format: [canvas.width, canvas.height], hotfixes: ['px_scaling'] });
        pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
        pdf.save('diagram.pdf');
        btn.textContent = '✓ Done!';
      } catch (e) {
        btn.textContent = '✗ Failed';
      }
      setTimeout(() => btn.textContent = orig, 2000);
    }
  </script>
