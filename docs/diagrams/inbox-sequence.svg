<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="title desc"><title id="title">Inbox / быстрый и свежий пути</title><desc id="desc">Сохранённый снимок даёт быстрый экран; свежий запрос зависит от провайдера</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern><marker id="a-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker><marker id="a-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34d399"/></marker><marker id="a-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a78bfa"/></marker><marker id="a-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fb7185"/></marker><marker id="a-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker><marker id="a-job" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fbbf24"/></marker></defs><rect width="1200" height="970" rx="18" fill="#020617"/><rect width="1200" height="970" rx="18" fill="url(#grid)" opacity=".55"/><g font-family="JetBrains Mono,Consolas,monospace"><text x="48" y="52" fill="#f8fafc" font-size="28" font-weight="600" text-anchor="start">Inbox / быстрый и свежий пути</text><text x="48" y="82" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="start">Сохранённый снимок даёт быстрый экран; свежий запрос зависит от провайдера</text><rect x="45" y="220" width="1110" height="224" rx="12" fill="#34d399" fill-opacity=".035" stroke="#34d399" stroke-opacity=".3"/><text x="70" y="474" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Обновление при устаревании или явном запросе</text><rect x="48" y="833" width="1104" height="78" rx="12" fill="#0f172a" stroke="#1e293b"/><text x="70" y="862" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="start">При пустом кэше</text><text x="70" y="888" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="start">Первое чтение ждёт Meta API. Кэш не продлевает токен и не выдаёт право на отправку.</text><path d="M175 202V810" stroke="#334155" stroke-dasharray="5 7"/><path d="M460 202V810" stroke="#334155" stroke-dasharray="5 7"/><path d="M745 202V810" stroke="#334155" stroke-dasharray="5 7"/><path d="M1030 202V810" stroke="#334155" stroke-dasharray="5 7"/><path d="M175 245H460" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-ui)"/><path d="M460 302H745" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-data)"/><path d="M745 360H460" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-data)" stroke-dasharray="7 6"/><path d="M460 417H175" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-ui)" stroke-dasharray="7 6"/><path d="M175 515H460" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-ui)"/><path d="M460 572H1030" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-external)"/><path d="M1030 632H460" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-external)" stroke-dasharray="7 6"/><path d="M460 692H745" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-data)"/><path d="M460 752H175" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-ui)" stroke-dasharray="7 6"/><rect x="65" y="130" width="220" height="72" rx="14" fill="#0f172a" s