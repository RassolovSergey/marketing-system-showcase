<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc"><title id="title">Inbox / чтение и фоновое обновление</title><desc id="desc">Открытие сохранённого диалога не требует повторного запроса к Meta</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern><marker id="a-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker><marker id="a-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34d399"/></marker><marker id="a-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a78bfa"/></marker><marker id="a-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fb7185"/></marker><marker id="a-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker><marker id="a-job" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fbbf24"/></marker></defs><rect width="1200" height="930" rx="18" fill="#020617"/><rect width="1200" height="930" rx="18" fill="url(#grid)" opacity=".55"/><g font-family="JetBrains Mono,Consolas,monospace"><text x="48" y="52" fill="#f8fafc" font-size="28" font-weight="600" text-anchor="start">Inbox / чтение и фоновое обновление</text><text x="48" y="82" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="start">Открытие сохранённого диалога не требует повторного запроса к Meta</text><text x="60" y="480" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="start">Независимое обновление: webhook, расписание или запрос пользователя</text><rect x="48" y="795" width="1104" height="78" rx="12" fill="#0f172a" stroke="#1e293b"/><text x="70" y="824" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="start">Пустой снимок и ограничения провайдера</text><text x="70" y="850" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="start">Неизвестное состояние показывается явно. Отправка ответа проверяет доступ отдельно.</text><path d="M140 200V760" stroke="#334155" stroke-dasharray="5 7"/><path d="M370 200V760" stroke="#334155" stroke-dasharray="5 7"/><path d="M600 200V760" stroke="#334155" stroke-dasharray="5 7"/><path d="M830 200V760" stroke="#334155" stroke-dasharray="5 7"/><path d="M1060 200V760" stroke="#334155" stroke-dasharray="5 7"/><path d="M140 240H370" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-ui)"/><path d="M370 300H600" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-data)"/><path d="M600 360H370" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-data)"/><path d="M370 420H140" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-ui)"/><path d="M830 540H1060" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-external)"/><path d="M1060 610H830" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-external)"/><path d="M830 680H600" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-data)"/><rect x="50" y="130" width="180" height="70" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65" stroke-width="1.5"/><rect x="66" y="150" width="4" height="30" rx="2" fill="#22d3ee"/><text x="84" y="165" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">UI</text><text x="84" y="192" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start"></text><rect x="280" y="130" width="180" height="70" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65" stroke-width="1.5"/><rect x="296" y="150" width="4" height="30" rx="2" fill="#34d399"/><text x="314" y="165" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">HTTP API</text><text x="314" y="192" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start"></text><rect x="510" y="130" width="180" height="70" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".65" stroke-width="1.5"/><rect x="526" y="150" width="4" height="30" rx="2" fill="#a78bfa"/><text x="544" y="165" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">PostgreSQL</text><text x="544" y="192" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start"></text><rect x="740" y="130" width="180" height="70" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-opacity=".65" stroke-width="1.5"/><rect x="756" y="150" width="4" height="30" rx="2" fill="#fbbf24"/><text x="774" y="165" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Worker</text><text x="774" y="192" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start"></text><rect x="970" y="130" width="180" height="70" rx="14" fill="#0f172a" stroke="#94a3b8" stroke-opacity=".65" stroke-width="1.5"/><rect x="986" y="150" width="4" height="30" rx="2" fill="#94a3b8"/><text x="1004" y="165" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Meta API</text><text x="1004" y="192" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start"></text><rect x="186.8" y="212" width="136.39999999999998" height="24" rx="6" fill="#020617"/><text x="255.0" y="228" fill="#22d3ee" font-size="14" font-weight="400" text-anchor="middle">Открыть диалог</text><rect x="421.1" y="272" width="127.8" height="24" rx="6" fill="#020617"/><text x="485.0" y="288" fill="#a78bfa" font-size="14" font-weight="400" text-anchor="middle">Читать снимок</text><rect x="416.8" y="332" width="136.39999999999998" height="24" rx="6" fill="#020617"/><text x="485.0" y="348" fill="#a78bfa" font-size="14" font-weight="400" text-anchor="middle">Данные + время</text><rect x="212.6" y="392" width="84.8" height="24" rx="6" fill="#020617"/><text x="255.0" y="408" fill="#22d3ee" font-size="14" font-weight="400" text-anchor="middle">Показать</text><rect x="881.1" y="512" width="127.8" height="24" rx="6" fill="#020617"/><text x="945.0" y="528" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Запрос порции</text><rect x="881.1" y="582" width="127.8" height="24" rx="6" fill="#020617"/><text x="945.0" y="598" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Ответ / лимит</text><rect x="668.3" y="652" width="93.39999999999999" height="24" rx="6" fill="#020617"/><text x="715.0" y="668" fill="#a78bfa" font-size="14" font-weight="400" text-anchor="middle">Сохранить</text><circle cx="54" cy="896" r="5" fill="#22d3ee"/><text x="70" y="901" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Интерфейс</text><circle cx="256" cy="896" r="5" fill="#34d399"/><text x="272" y="901" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Сервис</text><circle cx="471" cy="896" r="5" fill="#a78bfa"/><text x="487" y="901" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Хранилище</text><circle cx="686" cy="896" r="5" fill="#fb7185"/><text x="702" y="901" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Решение человека</text><circle cx="891" cy="896" r="5" fill="#94a3b8"/><text x="907" y="901" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Внешняя система</text></g></svg>