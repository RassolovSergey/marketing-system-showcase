рия и транзакции</text><rect x="60" y="580" width="300" height="104" rx="14" fill="#0f172a" stroke="#94a3b8" stroke-opacity=".65" stroke-width="1.5"/><rect x="76" y="600" width="4" height="64" rx="2" fill="#94a3b8"/><text x="94" y="615" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Источники данных</text><text x="94" y="642" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">REST / GraphQL</text><text x="94" y="663" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Браузер там, где API нет</text><rect x="450" y="580" width="300" height="104" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65" stroke-width="1.5"/><rect x="466" y="600" width="4" height="64" rx="2" fill="#34d399"/><text x="484" y="615" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Адаптеры</text><text x="484" y="642" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Нормализация и ошибки</text><text x="484" y="663" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Период / источник / время</text><rect x="840" y="580" width="300" height="104" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".65" stroke-width="1.5"/><rect x="856" y="600" width="4" height="64" rx="2" fill="#a78bfa"/><text x="874" y="615" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Архив кампании</text><text x="874" y="642" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Дневные записи</text><text x="874" y="663" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Контекст и ограничения</text><rect x="379.8" y="183" width="50.4" height="24" rx="6" fill="#020617"/><text x="405" y="199" fill="#22d3ee" font-size="14" font-weight="400" text-anchor="middle">HTTP</text><rect x="774.1" y="183" width="41.8" height="24" rx="6" fill="#020617"/><text x="795" y="199" fill="#a78bfa" font-size="14" font-weight="400" text-anchor="middle">TTL</text><rect x="611.8" y="517" width="50.4" height="24" rx="6" fill="#020617"/><text x="637" y="533" fill="#fbbf24" font-size="14" font-weight="400" text-anchor="middle">Сбор</text><rect x="371.2" y="603" width="67.6" height="24" rx="6" fill="#020617"/><text x="405" y="619" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Чтение</text><rect x="1000.5" y="517" width="59.0" height="24" rx="6" fill="#020617"/><text x="1030" y="533" fill="#a78bfa" font-size="14" font-weight="400" text-anchor="middle">Архив</text><circle cx="54" cy="856" r="5" fill="#22d3ee"/><text x="70" y="861" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Интерфейс</text><circle cx="256" cy="856" r="5" fill="#34d399"/><text x="272" y="861" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Сервис</text><circle cx="471" cy="856" r="5" fill="#a78bfa"/><text x="487" y="861" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Хранилище</text><circle cx="686" cy="856" r="5" fill="#fb7185"/><text x="702" y="861" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Решение человека</text><circle cx="891" cy="856" r="5" fill="#94a3b8"/><text x="907" y="861" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Внешняя система</text></g></svg>