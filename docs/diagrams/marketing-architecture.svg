<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc"><title id="title">Marketing System / архитектура</title><desc id="desc">Сохранённые данные доступны независимо от фонового обновления</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern><marker id="a-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker><marker id="a-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34d399"/></marker><marker id="a-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a78bfa"/></marker><marker id="a-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fb7185"/></marker><marker id="a-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker><marker id="a-job" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fbbf24"/></marker></defs><rect width="1200" height="890" rx="18" fill="#020617"/><rect width="1200" height="890" rx="18" fill="url(#grid)" opacity=".55"/><g font-family="JetBrains Mono,Consolas,monospace"><text x="48" y="52" fill="#f8fafc" font-size="28" font-weight="600" text-anchor="start">Marketing System / архитектура</text><text x="48" y="82" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="start">Сохранённые данные доступны независимо от фонового обновления</text><text x="60" y="132" fill="#94a3b8" font-size="14" font-weight="600" text-anchor="start">ИНТЕРФЕЙС</text><text x="450" y="132" fill="#94a3b8" font-size="14" font-weight="600" text-anchor="start">ОБРАБОТКА</text><text x="840" y="132" fill="#94a3b8" font-size="14" font-weight="600" text-anchor="start">ИСТОЧНИКИ И ДАННЫЕ</text><rect x="48" y="738" width="1104" height="78" rx="12" fill="#0f172a" stroke="#1e293b"/><text x="70" y="767" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="start">Свежесть и доступность разделены</text><text x="70" y="793" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="start">Нет данных не означает ноль. При ограничении API сохранённые снимки остаются доступны.</text><path d="M360 212H448" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-ui)"/><path d="M750 212H838" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-data)"/><path d="M360 422H448" fill="none" stroke="#fb7185" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-human)"/><path d="M750 422H838" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-external)"/><path d="M600 370V310H990V266" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-data)"/><path d="M600 474V578" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-api)"/><path d="M990 264H1170V632H1142" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-data)"/><rect x="60" y="160" width="300" height="104" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65" stroke-width="1.5"/><rect x="76" y="180" width="4" height="64" rx="2" fill="#22d3ee"/><text x="94" y="195" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Dashboard</text><text x="94" y="222" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">React / Vite</text><rect x="450" y="160" width="300" height="104" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65" stroke-width="1.5"/><rect x="466" y="180" width="4" height="64" rx="2" fill="#34d399"/><text x="484" y="195" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">HTTP API</text><text x="484" y="222" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Чтение сохранённых данных</text><rect x="840" y="160" width="300" height="104" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".65" stroke-width="1.5"/><rect x="856" y="180" width="4" height="64" rx="2" fill="#a78bfa"/><text x="874" y="195" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">PostgreSQL</text><text x="874" y="222" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Бизнес-история</text><text x="874" y="243" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Снимки переписок</text><rect x="60" y="370" width="300" height="104" rx="14" fill="#0f172a" stroke="#fb7185" stroke-opacity=".65" stroke-width="1.5"/><rect x="76" y="390" width="4" height="64" rx="2" fill="#fb7185"/><text x="94" y="405" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Webhook receiver</text><text x="94" y="432" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Отдельный публичный вход</text><text x="94" y="453" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Проверка входящих событий</text><rect x="450" y="370" width="300" height="104" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-opacity=".65" stroke-width="1.5"/><rect x="466" y="390" width="4" height="64" rx="2" fill="#fbbf24"/><text x="484" y="405" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Collector worker</text><text x="484" y="432" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Небольшие порции</text><text x="484" y="453" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Пауза после rate limit</text><rect x="840" y="370" width="300" height="104" rx="14" fill="#0f172a" stroke="#94a3b8" stroke-opacity=".65" stroke-width="1.5"/><rect x="856" y="390" width="4" height="64" rx="2" fill="#94a3b8"/><text x="874" y="405" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Внешние API</text><text x="874" y="432" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Метрики и сообщения</text><text x="874" y="453" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Задержки и ограничения</text><rect x="60" y="580" width="300" height="104" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65" stroke-width="1.5"/><rect x="76" y="600" width="4" height="64" rx="2" fill="#22d3ee"/><text x="94" y="615" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Приватный UI/API</text><text x="94" y="642" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Локальное рабочее место</text><text x="94" y="663" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Не опубликован туннелем</text><rect x="450" y="580" width="300" height="104" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65" stroke-width="1.5"/><rect x="466" y="600" width="4" height="64" rx="2" fill="#34d399"/><text x="484" y="615" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Адаптеры</text><text x="484" y="642" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Период / источник / время</text><text x="484" y="663" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Нормализация и ошибки</text><rect x="840" y="580" width="300" height="104" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".65" stroke-width="1.5"/><rect x="856" y="600" width="4" height="64" rx="2" fill="#a78bfa"/><text x="874" y="615" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Архив кампании</text><text x="874" y="642" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Дневные данные</text><text x="874" y="663" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start">Контекст решений</