xt</text><rect x="371.2" y="391" width="67.6" height="24" rx="6" fill="#020617"/><text x="405" y="407" fill="#fb7185" font-size="14" font-weight="400" text-anchor="middle">Signal</text><rect x="749.0" y="281" width="102.0" height="24" rx="6" fill="#020617"/><text x="800" y="297" fill="#a78bfa" font-size="14" font-weight="400" text-anchor="middle">Persistence</text><circle cx="54" cy="856" r="5" fill="#22d3ee"/><text x="70" y="861" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Interface</text><circle cx="256" cy="856" r="5" fill="#34d399"/><text x="272" y="861" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Service</text><circle cx="471" cy="856" r="5" fill="#a78bfa"/><text x="487" y="861" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Storage</text><circle cx="686" cy="856" r="5" fill="#fb7185"/><text x="702" y="861" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Human decision</text><circle cx="891" cy="856" r="5" fill="#94a3b8"/><text x="907" y="861" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">External system</text></g></svg>