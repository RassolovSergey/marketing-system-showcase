<head>
  <meta charset="UTF-8">

  <title>Inbox / чтение и фоновое обновление Architecture Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      min-height: 100vh;
      padding: 2rem;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 2rem;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .pulse-dot {
      width: 12px;
      height: 12px;
      background: #22d3ee;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;

    .subtitle {

      font-size: 0.875rem;

      background: rgba(15, 23, 42, 0.5);
      border-radius: 1rem;
      border: 1px solid #1e293b;
      padding: 1.5rem;
      overflow-x: auto;
    }

    svg {
      width: 100%;
      min-width: 900px;
      display: block;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }

    .card {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 0.75rem;
      border: 1px solid #1e293b;
      padding: 1.25rem;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .card-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .card-dot.cyan { background: #22d3ee; }
    .card-dot.emerald { background: #34d399; }
    .card-dot.violet { background: #a78bfa; }
    .card-dot.amber { background: #fbbf24; }
    .card-dot.rose { background: #fb7185; }

    .card h3 {
      font-size: 0.875rem;
      font-weight: 600;

    .card ul {
      list-style: none;
      color: #94a3b8;
      font-size: 0.75rem;

    .card li {
      margin-bottom: 0.375rem;
    }

    .footer {

      margin-top: 1.5rem;
      color: #475569;
      font-size: 0.75rem;

    .toolbar {
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
      flex-shrink: 0;
      align-items: center;
    }
    .toolbar-toggle {
      background: transparent;
      border: none;
      color: #475569;
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      transition: color 0.2s, background 0.2s;
    }
    .toolbar-toggle:hover { color: #94a3b8; background: rgba(30, 41, 59, 0.5); }
    .toolbar-actions {
      display: none;
      gap: 0.5rem;
    }
    .toolbar.expanded .toolbar-actions { display: flex; }
    .toolbar-actions button {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 0.375rem 0.75rem;
      border-radius: 0.375rem;
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .toolbar-actions button:hover {
      background: rgba(51, 65, 85, 0.8);
      color: white;
      border-color: #475569;
    }

    @media print {
      body { background: #020617; padding: 1rem; }
      .toolbar { display: none !important; }
    }
  </style>
<style>svg{display:block;width:100%;height:auto}.pulse-dot{animation:none}h1{font-size:24px}</style></head>

="180" height="70" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65" stroke-width="1.5"/><rect x="296" y="150" width="4" height="30" rx="2" fill="#34d399"/><text x="314" y="165" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">HTTP API</text><text x="314" y="192" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start"></text><rect x="510" y="130" width="180" height="70" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".65" stroke-width="1.5"/><rect x="526" y="150" width="4" height="30" rx="2" fill="#a78bfa"/><text x="544" y="165" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">PostgreSQL</text><text x="544" y="192" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start"></text><rect x="740" y="130" width="180" height="70" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-opacity=".65" stroke-width="1.5"/><rect x="756" y="150" width="4" height="30" rx="2" fill="#fbbf24"/><text x="774" y="165" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Worker</text><text x="774" y="192" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start"></text><rect x="970" y="130" width="180" height="70" rx="14" fill="#0f172a" stroke="#94a3b8" stroke-opacity=".65" stroke-width="1.5"/><rect x="986" y="150" width="4" height="30" rx="2" fill="#94a3b8"/><text x="1004" y="165" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Meta API</text><text x="1004" y="192" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start"></text><rect x="186.8" y="212" width="136.39999999999998" height="24" rx="6" fill="#020617"/><text x="255.0" y="228" fill="#22d3ee" font-size="14" font-weight="400" text-anchor="middle">Открыть диалог</text><rect x="421.1" y="272" width="127.8" height="24" rx="6" fill="#020617"/><text x="485.0" y="288" fill="#a78bfa" font-size="14" font-weight="400" text-anchor="middle">Читать снимок</text><rect x="416.8" y="332" width="136.39999999999998" height="24" rx="6" fill="#020617"/><text x="485.0" y="348" fill="#a78bfa" font-size="14" font-weight="400" text-anchor="middle">Данные + время</text><rect x="212.6" y="392" width="84.8" height="24" rx="6" fill="#020617"/><text x="255.0" y="408" fill="#22d3ee" font-size="14" font-weight="400" text-anchor="middle">Показать</text><rect x="881.1" y="512" width="127.8" height="24" rx="6" fill="#020617"/><text x="945.0" y="528" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Запрос порции</text><rect x="881.1" y="582" width="127.8" height="24" rx="6" fill="#020617"/><text x="945.0" y="598" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Ответ / лимит</text><rect x="668.3" y="652" width="93.39999999999999" height="24" rx="6" fill="#020617"/><text x="715.0" y="668" fill="#a78bfa" font-size="14" font-weight="400" text-anchor="middle">Сохранить</text><circle cx="54" cy="896" r="5" fill="#22d3ee"/><text x="70" y="901" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Интерфейс</text><circle cx="256" cy="896" r="5" fill="#34d399"/><text x="272" y="901" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Сервис</text><circle cx="471" cy="896" r="5" fill="#a78bfa"/><text x="487" y="901" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Хранилище</text><circle cx="686" cy="896" r="5" fill="#fb7185"/><text x="702" y="901" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Решение человека</text><circle cx="891" cy="896" r="5" fill="#94a3b8"/><text x="907" y="901" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Внешняя система</text></g></svg>
    </div>

    <!-- Footer -->
    <p class="footer">

  <script>
    async function copyAsImage(btn) {
      const orig = btn.textContent;
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        btn.textContent = '✓ Copied!';
      } catch (e) {
        btn.textContent = '✗ Failed';
      }
      setTimeout(() => btn.textContent = orig, 2000);
    }

    async function downloadPNG(btn) {
      const orig = btn.textContent;
      btn.textContent = '⏳ ...';
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const link = document.createElement('a');
        link.download = 'diagram.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        btn.textContent = '✓ Done!';
      } catch (e) {
        btn.textContent = '✗ Failed';
      }
      setTimeout(() => btn.textContent = orig, 2000);
    }

    async function downloadPDF(btn) {
      const orig = btn.textContent;
      btn.textContent = '⏳ ...';
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const orientation = canvas.width > canvas.height ? 'landscape' : 'portrait';
        const pdf = new jsPDF({ orientation, unit: 'px', format: [canvas.width, canvas.height], hotfixes: ['px_scaling'] });
        pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
        pdf.save('diagram.pdf');
        btn.textContent = '✓ Done!';
      } catch (e) {
        btn.textContent = '✗ Failed';
      }
      setTimeout(() => btn.textContent = orig, 2000);
    }
  </script>
</body>
