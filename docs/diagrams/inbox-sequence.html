<html lang="ru">
<head>
  <meta charset="UTF-8">

  <title>Inbox / быстрый и свежий пути Architecture Diagram</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      min-height: 100vh;
      padding: 2rem;
      color: white;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header {
      margin-bottom: 2rem;
    }
    
    .header-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }
    
    .pulse-dot {
      width: 12px;
      height: 12px;
      background: #22d3ee;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }

      border: 1px solid #1e293b;
      padding: 1.5rem;
      overflow-x: auto;
    }
    
    svg {
      width: 100%;
      min-width: 900px;
      display: block;
    }
    
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }
    
    .card {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 0.75rem;
      border: 1px solid #1e293b;
      padding: 1.25rem;
    }
    
    .card-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    
    .card-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    
    .card-dot.cyan { background: #22d3ee; }
    .card-dot.emerald { background: #34d399; }
    .card-dot.violet { background: #a78bfa; }
    .card-dot.amber { background: #fbbf24; }
    .card-dot.rose { background: #fb7185; }
    
    .card h3 {

      font-weight: 600;

    .card ul {

      color: #94a3b8;

      margin-bottom: 0.375rem;

      margin-top: 1.5rem;

    .toolbar {

      background: transparent;
      border: none;
      color: #475569;

      font-size: 1.25rem;
      line-height: 1;

    .toolbar-toggle:hover { color: #94a3b8; background: rgba(30, 41, 59, 0.5); }
    .toolbar-actions {
      display: none;
      gap: 0.5rem;
    }
    .toolbar.expanded .toolbar-actions { display: flex; }
    .toolbar-actions button {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 0.375rem 0.75rem;
      border-radius: 0.375rem;
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .toolbar-actions button:hover {
      background: rgba(51, 65, 85, 0.8);
      color: white;
      border-color: #475569;
    }

    @media print {
      body { background: #020617; padding: 1rem; }
      .toolbar { display: none !important; }

72a" stroke="#22d3ee" stroke-opacity=".65" stroke-width="1.5"/><rect x="81" y="150" width="4" height="32" rx="2" fill="#22d3ee"/><text x="99" y="165" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Интерфейс</text><text x="99" y="192" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start"></text><rect x="350" y="130" width="220" height="72" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65" stroke-width="1.5"/><rect x="366" y="150" width="4" height="32" rx="2" fill="#34d399"/><text x="384" y="165" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Node API</text><text x="384" y="192" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start"></text><rect x="635" y="130" width="220" height="72" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".65" stroke-width="1.5"/><rect x="651" y="150" width="4" height="32" rx="2" fill="#a78bfa"/><text x="669" y="165" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Redis</text><text x="669" y="192" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start"></text><rect x="920" y="130" width="220" height="72" rx="14" fill="#0f172a" stroke="#94a3b8" stroke-opacity=".65" stroke-width="1.5"/><rect x="936" y="150" width="4" height="32" rx="2" fill="#94a3b8"/><text x="954" y="165" fill="#f1f5f9" font-size="21" font-weight="600" text-anchor="start">Meta API</text><text x="954" y="192" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="start"></text><rect x="249.3" y="216" width="136.39999999999998" height="24" rx="6" fill="#020617"/><text x="317.5" y="232" fill="#22d3ee" font-size="14" font-weight="400" text-anchor="middle">Открыть диалог</text><rect x="525.7" y="273" width="153.6" height="24" rx="6" fill="#020617"/><text x="602.5" y="289" fill="#a78bfa" font-size="14" font-weight="400" text-anchor="middle">Проверить снимок</text><rect x="534.3" y="331" width="136.39999999999998" height="24" rx="6" fill="#020617"/><text x="602.5" y="347" fill="#a78bfa" font-size="14" font-weight="400" text-anchor="middle">Данные + время</text><rect x="249.3" y="388" width="136.39999999999998" height="24" rx="6" fill="#020617"/><text x="317.5" y="404" fill="#22d3ee" font-size="14" font-weight="400" text-anchor="middle">Показать сразу</text><rect x="245.0" y="486" width="145.0" height="24" rx="6" fill="#020617"/><text x="317.5" y="502" fill="#22d3ee" font-size="14" font-weight="400" text-anchor="middle">Обновить снимок</text><rect x="668.2" y="543" width="153.6" height="24" rx="6" fill="#020617"/><text x="745.0" y="559" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Запрос сообщений</text><rect x="676.8" y="603" width="136.39999999999998" height="24" rx="6" fill="#020617"/><text x="745.0" y="619" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Ответ / ошибка</text><rect x="542.9" y="663" width="119.19999999999999" height="24" rx="6" fill="#020617"/><text x="602.5" y="679" fill="#a78bfa" font-size="14" font-weight="400" text-anchor="middle">Обновить TTL</text><rect x="253.6" y="723" width="127.8" height="24" rx="6" fill="#020617"/><text x="317.5" y="739" fill="#22d3ee" font-size="14" font-weight="400" text-anchor="middle">Свежие данные</text><circle cx="54" cy="936" r="5" fill="#22d3ee"/><text x="70" y="941" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Интерфейс</text><circle cx="256" cy="936" r="5" fill="#34d399"/><text x="272" y="941" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Сервис</text><circle cx="471" cy="936" r="5" fill="#a78bfa"/><text x="487" y="941" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Хранилище</text><circle cx="686" cy="936" r="5" fill="#fb7185"/><text x="702" y="941" fill="#94a3b8" font-size="13" font-weight="400" text-anchor="start">Решение человека</text><circle cx="891" cy="936" r="5" fill="#94a3b8"/><text x="907" y="941" fill="#94a3b8" font-size="13" font-weight="400"     </div>

    <!-- Footer -->
    <p class="footer">
      Engineering case study · Editable SVG · Design adapted from Cocoon AI (MIT)

  <script>
    async function copyAsImage(btn) {
      const orig = btn.textContent;
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        btn.textContent = '✓ Copied!';
      } catch (e) {
        btn.textContent = '✗ Failed';
      }
      setTimeout(() => btn.textContent = orig, 2000);
    }

    async function downloadPNG(btn) {
      const orig = btn.textContent;
      btn.textContent = '⏳ ...';
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const link = document.createElement('a');
        link.download = 'diagram.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        btn.textContent = '✓ Done!';
      } catch (e) {
        btn.textContent = '✗ Failed';
      }
      setTimeout(() => btn.textContent = orig, 2000);
    }

    async function downloadPDF(btn) {
      const orig = btn.textContent;
      btn.textContent = '⏳ ...';
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const orientation = canvas.width > canvas.height ? 'landscape' : 'portrait';
        const pdf = new jsPDF({ orientation, unit: 'px', format: [canvas.width, canvas.height], hotfixes: ['px_scaling'] });
        pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
        pdf.save('diagram.pdf');
        btn.textContent = '✓ Done!';
      } catch (e) {
        btn.textContent = '✗ Failed';
      }
      setTimeout(() => btn.textContent = orig, 2000);
    }
  </script>
</body>
